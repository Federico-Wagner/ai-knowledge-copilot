name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  build-push-deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y%m%d')-${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-knowledge-copilot:${{ github.sha }} .

      - name: Tag version
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-knowledge-copilot:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-knowledge-copilot:${{ env.VERSION }}

      - name: Push SHA
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-knowledge-copilot:${{ github.sha }}

      - name: Push version
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-knowledge-copilot:${{ env.VERSION }}

      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-knowledge-copilot:${{ env.VERSION }}
            docker stop ai-knowledge-copilot || true
            docker rm ai-knowledge-copilot || true
            docker run -d \
              --name ai-knowledge-copilot \
              -p 80:8000 \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/ai-knowledge-copilot:${{ env.VERSION }}